<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | CampusHire</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #ecfeff);
            min-height: 100vh;
        }

        .registration-navbar {
            background: linear-gradient(90deg, #312e81, #4f46e5, #0891b2);
            padding: 18px 0;
        }

        .brand {
            color: white;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
        }

        .brand:hover {
            color: white;
        }

        .home-btn {
            color: white;
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 8px;
            padding: 8px 16px;
            text-decoration: none;
        }

        .home-btn:hover {
            background: white;
            color: #312e81;
        }

        .registration-section {
            padding: 60px 0;
        }

        .registration-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(30, 41, 59, 0.15);
            border: 1px solid #e2e8f0;
        }

        .registration-title {
            color: #172554;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .registration-subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-label {
            color: #1e293b;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-control,
        .form-select {
            min-height: 48px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            color: #1e293b;
            background: white;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .form-check-label {
            color: #475569;
        }

        .register-btn {
            background: linear-gradient(90deg, #4f46e5, #0891b2);
            border: none;
            color: white;
            font-weight: 700;
            padding: 13px;
            border-radius: 10px;
        }

        .register-btn:hover {
            color: white;
            transform: translateY(-1px);
        }

        .login-text {
            color: #64748b;
            margin-top: 22px;
        }

        .login-text a {
            color: #4f46e5;
            font-weight: 700;
            text-decoration: none;
        }

        .login-text a:hover {
            color: #0891b2;
        }

        .registration-footer {
            text-align: center;
            padding: 25px;
            color: #475569;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
        }

        .registration-footer strong {
            color: #312e81;
        }

        @media (max-width: 768px) {

            .registration-card {
                padding: 25px;
            }

            .registration-title {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="registration-navbar">

        <div class="container d-flex justify-content-between align-items-center">

            <a href="index.html" class="brand">
                🎓 CampusHire
            </a>

            <a href="index.html" class="home-btn">
                <i class="bi bi-arrow-left"></i>
                Back to Home
            </a>

        </div>

    </nav>


    <!-- REGISTRATION -->

    <section class="registration-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-8 col-xl-7">

                    <div class="registration-card">

                        <div class="text-center">

                            <h1 class="registration-title">
                                Create Student Account
                            </h1>

                            <p class="registration-subtitle">
                                Register now and explore exciting placement opportunities.
                            </p>

                        </div>


                        <form id="registrationForm">


                            <!-- NAME -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="studentName"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required>

                            </div>


                            <!-- EMAIL -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="studentEmail"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <!-- PHONE -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    id="studentPhone"
                                    class="form-control"
                                    placeholder="Enter 10-digit mobile number"
                                    maxlength="10"
                                    required>

                            </div>


                            <!-- COURSE -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Course / Branch
                                </label>

                                <select
                                    id="studentCourse"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select your course
                                    </option>

                                    <option value="B.E EEE">
                                        B.E Electrical and Electronics Engineering
                                    </option>

                                    <option value="B.E CSE">
                                        B.E Computer Science Engineering
                                    </option>

                                    <option value="B.E ECE">
                                        B.E Electronics and Communication Engineering
                                    </option>

                                    <option value="B.Tech IT">
                                        B.Tech Information Technology
                                    </option>

                                    <option value="B.E Mechanical">
                                        B.E Mechanical Engineering
                                    </option>

                                </select>

                            </div>


                            <!-- COLLEGE -->

                            <div class="mb-3">

                                <label class="form-label">
                                    College Name
                                </label>

                                <input
                                    type="text"
                                    id="studentCollege"
                                    class="form-control"
                                    placeholder="Enter your college name"
                                    required>

                            </div>


                            <!-- PASSWORD -->

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Password
                                    </label>

                                    <input
                                        type="password"
                                        id="studentPassword"
                                        class="form-control"
                                        placeholder="Create password"
                                        required>

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Confirm Password
                                    </label>

                                    <input
                                        type="password"
                                        id="confirmPassword"
                                        class="form-control"
                                        placeholder="Confirm password"
                                        required>

                                </div>

                            </div>


                            <!-- TERMS -->

                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="agreeRegistration"
                                    required>

                                <label class="form-check-label">

                                    I agree that the information provided is accurate.

                                </label>

                            </div>


                            <!-- REGISTER BUTTON -->

                            <button
                                type="submit"
                                class="btn register-btn w-100">

                                Create Student Account

                                <i class="bi bi-arrow-right"></i>

                            </button>


                        </form>


                        <div class="text-center login-text">

                            Already have an account?

                            <a href="index.html#login">
                                Login here
                            </a>

                        </div>


                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer class="registration-footer">

        🎓 <strong>CampusHire</strong>

        <br>

        <small>
            Connecting students with career opportunities
        </small>

    </footer>


    <!-- ONLY ONE SCRIPT -->

    <script src="script.js"></script>


</body>

</html>
```
